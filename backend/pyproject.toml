[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ekip-backend"
version = "1.0.0"
description = "Local-first Enterprise Knowledge Intelligence Platform backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<2.1",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<1",
  "redis>=6,<7",
  "celery>=5.5,<6",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "structlog>=25,<26",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.34,<2",
  "opentelemetry-sdk>=1.34,<2",
  "opentelemetry-exporter-otlp>=1.34,<2",
  "tenacity>=9,<10",
  "minio>=7.2,<8",
  "pypdf>=6.13.3,<7",
  "python-docx>=1.2,<2",
  "beautifulsoup4>=4.13,<5",
  "rank-bm25>=0.2.2,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S104", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S108"]
