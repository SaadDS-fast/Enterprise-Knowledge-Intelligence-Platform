apiVersion: apps/v1
kind: Deployment
metadata: {name: ekip-backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: ekip-backend}}
  template:
    metadata: {labels: {app: ekip-backend}}
    spec:
      serviceAccountName: ekip-backend
      securityContext: {runAsNonRoot: true}
      containers:
        - name: backend
          image: ekip-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - {configMapRef: {name: ekip-config}}
            - {secretRef: {name: ekip-secrets}}
          ports: [{containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /api/v1/health/ready, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/v1/health/live, port: 8000}, initialDelaySeconds: 10, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 1Gi}
