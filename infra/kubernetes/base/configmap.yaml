apiVersion: v1
kind: ConfigMap
metadata:
  name: ekip-config
data:
  APP_ENV: development
  APP_VERSION: "1.0.0"
  API_V1_PREFIX: /api/v1
  AUTO_INIT_DB: "true"
  DATABASE_URL: postgresql+asyncpg://ekip:ekip@postgres:5432/ekip
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JOB_EXECUTION_MODE: celery
  OBJECT_STORAGE_PROVIDER: minio
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_ACCESS_KEY: minioadmin
  OBJECT_STORAGE_BUCKET: documents
  OBJECT_STORAGE_SECURE: "false"
  LLM_PROVIDER: local
  LOCAL_LLM_BACKEND: extractive
  CORS_ORIGINS: http://localhost:3000,http://ekip.local
  TRUSTED_HOSTS: localhost,127.0.0.1,ekip.local,ekip-backend
  OTEL_ENABLED: "false"
