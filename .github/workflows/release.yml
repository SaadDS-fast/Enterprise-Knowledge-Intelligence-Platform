name: Release Source Archive
on:
  push: {tags: ["v*"]}
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=ekip-${GITHUB_REF_NAME}.zip HEAD
      - uses: softprops/action-gh-release@v2
        with: {files: "ekip-*.zip", generate_release_notes: true}
