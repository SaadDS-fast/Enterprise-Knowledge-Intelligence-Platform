name: Container Scan
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ekip-backend:ci backend
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ekip-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
